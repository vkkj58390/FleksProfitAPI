name: .NET tests

on:
  pull_request:
    branches:
      - "**"   # alle PRs
  push:
    branches:
      - "**"   # alle pushes
    paths-ignore:
      - "README.md"
      - ".github/**"  # undgå workflow loops

jobs:

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FleksProfitAPI/FleksProfitAPI.sln

      - name: Build
        run: dotnet build FleksProfitAPI/FleksProfitAPI.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test ./FleksProfitAPI.Tests/FleksProfitAPI.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=unit-tests.trx" \
            --filter "TestCategory!=Integration"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/*.trx"


  integration-tests:
    name: Integration tests (main branch only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FleksProfitAPI/FleksProfitAPI.sln

      - name: Build
        run: dotnet build FleksProfitAPI/FleksProfitAPI.sln --no-restore -c Release

      - name: Run integration tests
        run: dotnet test ./FleksProfitAPI.Tests/FleksProfitAPI.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=integration-tests.trx" \
            --filter "TestCategory=Integration"

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: "**/*.trx"
