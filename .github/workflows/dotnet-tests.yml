name: .NET tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit tests (fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run unit tests (exclude Integration)
        run: |
          dotnet test ./FleksProfitAPI.Tests/FleksProfitAPI.Tests.csproj --no-build -c Release --logger "console;verbosity=normal" --filter "TestCategory!=Integration"

  integration-tests:
    name: Integration tests (docker)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run integration tests (Integration only)
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: |
          docker version
          dotnet test ./FleksProfitAPI.Tests/FleksProfitAPI.Tests.csproj --no-build -c Release --logger "console;verbosity=normal" --filter "TestCategory=Integration"