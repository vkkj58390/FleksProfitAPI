name: .NET CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
    paths-ignore:
      - "README.md"
      - ".github/**"
      - "!.github/workflows/*"

jobs:

  setup-trx2junit:
    name: Setup trx2junit
    runs-on: ubuntu-22.04
    outputs:
      tool-path: ${{ steps.set-output-tool-path.outputs.tool-path }}
    steps:
      - name: Cache trx2junit tool
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-trx2junit

      - name: Install trx2junit
        if: steps.cache.outputs.cache-hit != 'true'
        run: dotnet tool install -g trx2junit

      - name: Set tool path
        id: set-output-tool-path
        run: echo "tool-path=~/.dotnet/tools" >> $GITHUB_OUTPUT

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    needs: setup-trx2junit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore FleksProfitAPI/FleksProfitAPI.sln

      - name: Build
        run: dotnet build FleksProfitAPI/FleksProfitAPI.sln --no-restore -c Release

      - name: Run unit tests
        run: |
          dotnet test ./FleksProfitAPI.Tests/FleksProfitAPI.Tests.csproj \
            --no-build -c Release \
            --results-directory test-results \
            --logger "trx;LogFileName=unit-tests.trx" \
            --filter "TestCategory!=Integration"

      - name: Convert TRX → JUnit
        run: trx2junit test-results/*.trx

      - name: Report test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: [setup-trx2junit, unit-tests]
    timeout-minutes: 30
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore FleksProfitAPI/FleksProfitAPI.sln

      - name: Build
        run: dotnet build FleksProfitAPI/FleksProfitAPI.sln --no-restore -c Release

      - name: Run integration tests
        run: |
          dotnet test ./FleksProfitAPI.Tests/FleksProfitAPI.Tests.csproj \
            --no-build -c Release \
            --results-directory test-results \
            --logger "trx;LogFileName=integration-tests.trx" \
            --filter "TestCategory=Integration"

      - name: Convert TRX → JUnit
        run: trx2junit test-results/*.trx

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration Tests
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: false
