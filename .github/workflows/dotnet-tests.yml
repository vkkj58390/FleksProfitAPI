name: .NET CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
    paths-ignore:
      - "README.md"
      - ".github/**"             # Undgå workflow loops
      - "!.github/workflows/*"    # Workflow køres ved ændring af workflow-fil
jobs:

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FleksProfitAPI/FleksProfitAPI.sln

      - name: Build
        run: dotnet build FleksProfitAPI/FleksProfitAPI.sln --no-restore -c Release

      - name: Run unit tests
        run: |
          dotnet test ./FleksProfitAPI.Tests/FleksProfitAPI.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=unit-tests.trx" \
            --filter "TestCategory!=Integration"

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/*.trx"

  integration-tests:
    name: Integration tests (PR + main)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    # Integration-tests kører kun på PR mod main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FleksProfitAPI/FleksProfitAPI.sln

      - name: Build
        run: dotnet build FleksProfitAPI/FleksProfitAPI.sln --no-restore -c Release

      - name: Run integration tests
        run: |
          dotnet test ./FleksProfitAPI.Tests/FleksProfitAPI.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=integration-tests.trx" \
            --filter "TestCategory=Integration"

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: "**/*.trx"
